  # ============ 模式库反哺（P-003 启动 ANR）============
  - case_id: NEG-ANR-001
    dimension: 并发
    name: [P-003 反哺] 登录页主线程敏感点叠加：60s Timer + autofill 自动提交 + 第三方回调并发窗口
    expected_type: suspected-defect
    method_design:
      error_guessing: "三个已知主线程敏感点在最坏窗口叠加，做 hierarchy 可达性探针"
    precondition: "执行从先做启动 ANR 探针（模式库 P-003 反哺动作：hierarchy 可达性检查通过才进业务断言）"
    steps:
      - do: "短信发码后倒计时运行中（Timer 活跃），立即粘贴 4 位码触发自动提交，同时第三方授权回调到达（Mock 并发）"
        expect: "UI 不冻结；1s 内 hierarchy 仍可达（登录页 locator 可查询）；登录请求正常收口"
      - do: "若出现 'isn't responding' ANR 对话框"
        expect: "按 P-003 流程：捕捉 hierarchy/截图证据，登记 ANR 候选，不进业务断言、不提单（未稳定复现前）"
    locators:
      hivi_test_ids: ["login_page", "login_code_field"]
      value_keys: ["login-code-field"]
    test_data: "TEST-SYNTHETIC: tel=13800000001, code=1234"
    repro_points: "P-003 已有一次候选（SWAN-BUG-20260904-004）且 SWAN-20260904-005 复核时登录页是 ANR 后第一可达页面——本条把登录页三个敏感点主动叠加压测；任何一次 ANR 即升级反哺动作"
    recovery: "杀进程重启"
    tags: [L2, negative, flaky?, experimental?]
    channels: [assertion]

  # ============ token 有效期策略（变更单 G3 追加）============
  - case_id: NEG-TOKEN-003
    dimension: 状态跳跃
    name: token 有效期 TTL 维度：过期 JWT 冷启动仍直进 authenticated，暴露时点后置到首个业务请求
    expected_type: suspected-defect
    method_design:
      error_guessing: "注入 exp 已过的合法格式 JWT，专断言 TTL 维度（与 NEG-TOKEN-001 同手法、不同变量：NEG-TOKEN-001 断言垃圾 token 的暴露时点，本条断言过期时间不被校验）"
    precondition: "步骤 0（硬前置）：先真实登录成功并验证 token 三处落盘非空（参照 POS-002 主路径）作为有效会话基线，再注入过期 JWT 并冷启动——TTL 维度断言（过期不被校验+暴露时点后置）只有从有效会话态出发才有意义，空 token 态只能证明 loginRequired 兜底，未建立有效会话禁止进入注入步。可修改设备 SharedPreferences（debug 包 / adb）。已知事实（SWAN-20260907-000 环境验证）：测试服签发 JWT 有效期整 10 年（exp=iat+315360000s）"
    steps:
      - do: "构造 exp 已过期的合法格式 JWT（header.payload.signature 三段齐全、payload.exp 为过去时间戳，全字段 TEST-SYNTHETIC 自造，非真实签发），写入 SharedPreferences auth_token（带 Bearer 前缀），冷启动"
        expect: "客户端启动恢复不校验 exp：adoptToken 直进 authenticated，启动阶段零校验请求（断言启动网络层无 token 校验调用）"
      - do: "进任一业务页触发首个业务请求"
        expect: "服务端返回失效业务码（30003/30001）→ 全局登出落登录页；暴露窗口=冷启动到首个业务请求之间，此期间客户端认为会话有效"
      - do: "记录 token 生命周期事实（非断言，供报告从定级）：exp-iat 差值=315360000s（10 年）；客户端源码无任何过期校验路径（依据 storage_port.dart 读写分支 / app_startup_controller.dart adoptToken 与 initialize 流程）；无 refresh 机制"
        expect: "事实链完整：服务端 10 年 TTL + 客户端不校验 exp + 无续期/登出兜底 → 泄露 token 在最长 10 年内可离线复用至首次失效码命中"
    locators:
      hivi_test_ids: ["me_page", "login_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: 自造过期 JWT，如 exp=1700000000（2023-11，已过期）、iat=1690000000、payload.sub=test-synthetic-user；严禁使用测试服真实签发 token 参与断言"
    repro_points: "三段式 JWT 缺一不可（畸形 token 走 NEG-TOKEN-002 的非法格式路径，不命中本条 TTL 语义）；对照点：若未来客户端加入 exp 预校验，本条冷启动应落 loginRequired——当前预期是直进 authenticated；10 年 TTL 属服务端签发策略，客户端未防护是本条记录点，报告从甄别定级；未执行步骤 0（无有效会话基线）即注入=无效重现，结果记 BLOCKED"
    recovery: "登出或清除应用数据"
    tags: [L2, negative, security-recon]
    channels: [assertion]


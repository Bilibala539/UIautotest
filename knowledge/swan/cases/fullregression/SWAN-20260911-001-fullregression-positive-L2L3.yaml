    name: "设置/切服 UI 无挂载回归断言（全 dump 文本检索）"
    domain: "设置/切服/平台通道"
    tags: [L2, contract-regression]
    precondition_class: 需登录态
    precondition: "登录态 AppShell；对齐 states-matrix §33：本基线『设置/切服/平台通道』无 UI 入口"
    automation:
      maestro: "半自动（需 adb uiautomator dump 或 Maestro 层级导出后文本检索；切服若意外出现入口=**禁点**，只上报）"
      notes: "回归语义：若快照新增了 UI 入口 → 按新入口登记用例缺口并上报主对话（严禁直接操作切服）；若仍无入口 → 契约保持绿"
    evidence: ["settings-sweep__me-page__dump.xml", "settings-sweep__personinfo__dump.xml"]
    steps:
      - do: "我的页与 person_info 页各做全量 dump，检索『设置』『切服』『通道』关键词"
        expect: "仅命中『音质设置』（既有），无独立设置页/切服/平台通道 UI 入口（无挂载契约保持）"
    device: android-emulator

  # ================= D18 视频与投屏 =================
  - case_id: FR-L2-POS-170
    name: "视频分类/播放页入口可达抽样（条件执行）+ 投屏 BLOCKED(env) 登记"
    domain: "视频与投屏"
    tags: [L2, conditional, BLOCKED-env]
    precondition_class: 需登录态
    precondition: "入口未在 states-matrix 单独实测（/music_platform/qq/video-classify 经 QQ 详情域推断）——**执行时先定位真实入口，找不到入口记『入口未达（登记）』不判失败**"
    automation:
      maestro: "半自动；视频播放页若打开：**断言播放器控件渲染即止，禁触发实际播放**（无音频硬件 device-divergence）；投屏浮窗/设备选择 sheet 无实体设备可达 = BLOCKED(env)"
    evidence: ["video__classify__opened.png（若入口可达）", "（登记）投屏真机需求条目"]
    steps:
      - do: "在 QQ 音乐详情域定位视频分类入口并进入（若存在）"
        expect: "视频分类页可达渲染"
      - do: "进入任一视频播放页（若可达）"
        expect: "播放页控件结构渲染；实际播放/投屏断言 BLOCKED(env) 登记"
    device: android-emulator

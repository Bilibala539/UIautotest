cases:
  # ============ 会话失效（30003/30001/40006）============
  - case_id: NEG-SESS-001
    dimension: 状态跳跃
    name: 会话失效码 30003 触发全局登出清栈回登录页
    expected_type: expected
    method_design:
      error_guessing: "在 authenticated 态注入业务码 30003 响应（代理/Mock 任一业务接口）"
    precondition: "硬前置：有效登录态已建立且经抓包验证 token 三处落盘非空（SharedPreferences auth_token / NetworkConfigFallbackStore._httpToken / Dio Authorization header），authenticated（AppShell 可达）；代理工具可拦截业务响应。前置不满足（空 token 态）→BLOCKED：空态只会走 loginRequired 兜底，无法重现失效链路，禁止降级执行"
    steps:
      - do: "登录成功后进入任一业务页，代理返回业务码 30003"
        expect: "AppSessionInvalidationCoordinator 登出；_clearSessionState 清 lastUserInfoResponeBean/Qobuz 星标缓存/auth_token/fallback token；Toast「登录状态过时」(loginStatusObsolete)"
      - do: "观察当前页面与路由栈"
        expect: "落 loginRequired 登录页；PlatformCatalogNotifier.reset() 已执行；原二级页不留存"
    locators:
      hivi_test_ids: ["login_page"]
      value_keys: ["login-phone-field"]
    test_data: "TEST-SYNTHETIC: 代理注入 {code:30003}"
    repro_points: "必须在 runApp 前已订阅 Coordinator（首帧前 30003 也应生效）；断言 token 三处存储（SharedPreferences auth_token / NetworkConfigFallbackStore._httpToken / Dio header）全空；开跑前核对硬前置：token 三处落盘非空方可执行（空 token 态本条无效，记 BLOCKED）"
    recovery: "重新登录"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-SESS-002
    dimension: 状态跳跃
    name: 会话失效码 30001/40006 等价类：与 30003 同集合同行为
    expected_type: expected
    method_design:
      equivalence_classes:
        - {class: "失效码 30001(tokenInvalid)", input: "{code:30001}", expected: "登出清栈回登录页"}
        - {class: "失效码 40006(tokenInvalid)", input: "{code:40006}", expected: "登出清栈回登录页"}
    precondition: "硬前置：有效登录态已建立且经抓包验证 token 三处落盘非空；代理可注入业务码。前置不满足→BLOCKED（空态无会话可失效，重现无效）"
    steps:
      - do: "分别注入 30001、40006"
        expect: "两码均命中失效集合 {30003,30001,40006}，行为与 30003 完全一致（登出+Toast+清栈）"
      - do: "注入非失效业务码（如 50017 之外的业务失败码）作对照"
        expect: "不触发登出，仅按该码自身语义处理"
    locators:
      hivi_test_ids: ["login_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: {code:30001} / {code:40006}"
    repro_points: "40006 出处源码仅有 Android 对齐注释，实际触发接口待接口侧确认（卡片未决问题），若代理无法构造走 Mock 层；开跑前核对硬前置：token 三处落盘非空（空 token 态记 BLOCKED）"
    recovery: "重新登录"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-SESS-003
    dimension: 状态跳跃
    name: 同失效码 2s 内重复事件去重，仅一次登出一次 Toast
    expected_type: expected
    method_design:
      boundary_values:
        - {field: "同码事件间隔", value: "<2s", expected: "第二次被吞（去重窗口）"}
        - {field: "同码事件间隔", value: ">2s", expected: "第二次在 isAuthenticated=false 时被拦（非去重）"}
    precondition: "硬前置：有效登录态已建立且经抓包验证 token 三处落盘非空；可让同一接口在 2s 内返回两次 30003（如页面并发发两个请求）。前置不满足→BLOCKED（空态无会话可失效，重现无效）"
    steps:
      - do: "2s 内触发两次同码 30003 响应"
        expect: "仅一次登出流程、一次 loginStatusObsolete Toast；无重复清栈/连续弹 Toast"
      - do: "间隔 >2s 再次注入 30003"
        expect: "此时已非 authenticated，仍不产生第二次登出副作用（isAuthenticated 门禁）"
    locators:
      hivi_test_ids: ["login_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: {code:30003} x2 within 2s"
    repro_points: "去重键为 code 本身（非全码集合）；验证 Toast 只出现一次是本条核心断言；开跑前核对硬前置：token 三处落盘非空（空 token 态记 BLOCKED）"
    recovery: "重新登录"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-SESS-004
    dimension: 并发
    name: 手动登出后在途请求带回失效码，不误报登出 Toast
    expected_type: expected
    method_design:
      error_guessing: "登出瞬间故意留一个在途业务请求，其响应稍后带回 30003"
    precondition: "硬前置：有效登录态已建立且经抓包验证 token 三处落盘非空；某业务页有慢请求在途。前置不满足→BLOCKED（空态无会话可失效，重现无效）"
    steps:
      - do: "慢请求在途时到个人信息页点「退出登入」登出成功"
        expect: "正常登出落登录页"
      - do: "在途请求响应返回 30003"
        expect: "Coordinator 因 isAuthenticated=false 拦截：无二次 Toast、无重复清栈、登录页状态不被扰动"
    locators:
      hivi_test_ids: ["person_info_page", "person_info_logout_button", "login_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: 延迟 3s 返回 {code:30003} 的在途响应"
    repro_points: "对照场景：登出失败（见 NEG-OUT-001）时 token 保留、仍 authenticated，此时在途 30003 应正常触发登出——两条共用同一在途构造手法；开跑前核对硬前置：token 三处落盘非空（空 token 态记 BLOCKED）"
    recovery: "重新登录"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-SESS-005
    dimension: 状态跳跃
    name: 深层二级页（绑定页/搜索页）收到失效码：popUntil(isFirst) 清栈无残留
    expected_type: expected
    method_design:
      state_transition:
        - {from: "authenticated(二级页)", event: "业务码 30003", to: "loginRequired", guard: "isAuthenticated==true"}
    precondition: "硬前置：有效登录态已建立且经抓包验证 token 三处落盘非空，并 push 到二级页（/login/bind-phone 或任一 push 页）。前置不满足→BLOCKED（空态无会话可失效，重现无效）"
    steps:
      - do: "停留在二级页时注入 30003"
        expect: "根 Navigator popUntil(isFirst) 清空全部 push 页 + PlatformCatalogNotifier.reset()；最终只见登录页"
      - do: "检查二级页状态（如绑定页已输入内容、平台目录列表）"
        expect: "平台目录已 reset（无旧用户平台残留）；回登录页重新登录后无上一用户会话痕迹"
    locators:
      hivi_test_ids: ["login_page", "login_bind_phone_page(如已注册 testId；否则用 ValueKey)"]
      value_keys: ["login-phone-field", "login-code-field"]
    test_data: "TEST-SYNTHETIC: {code:30003}"
    repro_points: "反面断言：若清栈缺失，用户重新登录后会落在原二级页（考古明确该坑是 _clearRouteStackOnLogout 修复目标），执行时重点看有没有回归；开跑前核对硬前置：token 三处落盘非空（空 token 态记 BLOCKED）"
    recovery: "重新登录"
    tags: [L2, negative]
    channels: [assertion]

  # ============ token 明文 + 启动不校验 ============
  - case_id: NEG-TOKEN-001
    dimension: 状态跳跃
    name: 篡改 auth_token 后冷启动直进 authenticated，暴露时点后置到首个业务请求
    expected_type: suspected-defect
    method_design:
      error_guessing: "启动恢复路径注入垃圾 token，观察暴露时点"
    precondition: "步骤 0（硬前置）：先真实登录成功并验证 token 三处落盘非空（参照 POS-002 主路径），再做注入/篡改操作与冷启动——本条断言的暴露时点/失效链路只有从有效会话态出发才有意义，空 token 态只能证明 loginRequired 兜底，不能证明失效链路，未建立有效会话禁止进入注入步。可修改设备 SharedPreferences（debug 包 / adb）"
    steps:
      - do: "向 SharedPreferences 写 auth_token='Bearer tampered-invalid-token'，冷启动"
        expect: "AppStartupGate 不发校验请求，adoptToken 直接进 authenticated（暴露时点=首个业务请求返回失效码时）"
      - do: "进任一业务页触发首个业务请求"
        expect: "业务码 30003/30001 回来 → 全局登出落登录页，中间态期间 UI 不崩溃"
    locators:
      hivi_test_ids: ["me_page", "login_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: auth_token='Bearer tampered-invalid-token'"
    repro_points: "疑点记录（不提单）：token 明文存储+启动零校验，攻击面=root 设备直接伪造登录态；断言点1 启动到 authenticated 的耗时（无网络请求）；断言点2 暴露前是否有任何越权 UI 可操作（如个人信息页读到空用户缓存 lastUserInfoResponeBean 被删后的表现）；未执行步骤 0（无有效会话基线）即注入=无效重现，结果记 BLOCKED"
    recovery: "登出或清除应用数据"
    tags: [L2, negative, security-recon]
    channels: [assertion]

  - case_id: NEG-TOKEN-002
    dimension: 非法格式
    name: auth_token 无 Bearer 前缀/空串/纯空白 的恢复边界
    expected_type: expected
    method_design:
      equivalence_classes:
        - {class: "无 Bearer 前缀", input: "raw-token-no-prefix", expected: "观察是否按原样 adopt（_normalizeBearerToken 仅写路径）"}
        - {class: "空串", input: "\"\"", expected: "按无 token 处理，落 loginRequired"}
        - {class: "纯空白", input: "'   '", expected: "观察 isEmpty 判定是否把空白当有效 token（疑似缺陷信号）"}
    precondition: "步骤 0（硬前置）：先真实登录成功并验证 token 三处落盘非空（参照 POS-002 主路径）建立有效会话基线，再分别注入三类值后冷启动——恢复链路差异只有从有效会话态出发才有意义，空 token 态只能证明 loginRequired 兜底。可修改设备存储"
    steps:
      - do: "注入空串冷启动"
        expect: "落登录页（token 存在性判定应排除空串）"
      - do: "注入纯空白串冷启动"
        expect: "若进 authenticated 则记 suspected-defect 信号（空白 token 被当有效）；无崩溃"
      - do: "注入无 Bearer 前缀 token 冷启动"
        expect: "记录实际行为（读路径是否有归一化，对照 OHOS OhosPreferencesStoragePort 的回写分支——卡片标注该分支未逐行确认）"
    locators:
      hivi_test_ids: ["login_page", "me_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: ['' , '   ', 'raw-token-no-prefix']"
    repro_points: "三组值逐次冷启动、逐次记录启动 stage；OHOS 平台另行用 OhosPreferencesStoragePort 路径复测（待设备在环，先登记）；未执行步骤 0（无有效会话基线）即注入=无效重现，结果记 BLOCKED"
    recovery: "清除应用数据"
    tags: [L2, negative]
    channels: [assertion]

  # ============ 验证码链路 ============
  - case_id: NEG-SMS-001
    dimension: 非法格式
    name: 错误验证码失败后 autofill 回填同码：无反应是设计行为，修改后才重提交
    expected_type: expected
    method_design:
      error_guessing: "利用 _lastFailedSmsCode 防重逻辑构造 autofill 重复提交"
    precondition: "登录页短信模式；已收到真实验证码（服务端测试号 TEST-SYNTHETIC）"
    steps:
      - do: "输入错误 4 位码（如 9999），满 4 位自动提交"
        expect: "登录失败，login_error_text 显示收敛后文案；_lastFailedSmsCode='9999'"
      - do: "让 autofill/剪贴板再次回填同一码 9999（_onSmsCodeChanged 再收到相同 4 位）"
        expect: "无网络请求、页面无反应——设计行为（防 autofill 死循环），非卡死；无 loading"
      - do: "手动修改一位（如 9998）"
        expect: "立即恢复自动提交，正常发登录请求"
    locators:
      hivi_test_ids: ["login_code_field", "login_error_text"]
      value_keys: ["login-code-field"]
    test_data: "TEST-SYNTHETIC: tel=13800000001, 错误码 9999→9998"
    repro_points: "自动化重试脚本若原样重放同码会被防重逻辑吞掉——执行从脚本必须知道这是设计行为，失败重试需先改输入；断言网络层（代理）第二次无 /user/login 请求"
    recovery: "输入新码"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-SMS-002
    dimension: 非法格式
    name: 过期验证码登录失败，错误文案收敛且输入变化即清错
    expected_type: expected
    method_design:
      equivalence_classes:
        - {class: "过期码", input: "服务端已过期的 4 位码", expected: "业务失败，inline error 本地化文案"}
        - {class: "未请求过码的随机码", input: "1234(未发码)", expected: "业务失败，同收敛文案路径"}
    precondition: "短信模式；能拿到过期码（发码后等待过期或服务端固定过期码）"
    steps:
      - do: "输入过期码自动提交"
        expect: "登录失败，login_error_text 展示 HttpUserMessageResolver 转换后的本地化文案，不透出服务端英文原文/堆栈"
      - do: "点击手机号输入框任意修改字符"
        expect: "旧错误立即被 clearLoginError/_clearInlineError 清除（输入变化即清错）"
    locators:
      hivi_test_ids: ["login_code_field", "login_error_text", "login_phone_field"]
      value_keys: ["login-code-field", "login-phone-field"]
    test_data: "TEST-SYNTHETIC: tel=13800000001"
    repro_points: "Selector 只重建 _LoginInlineError 不重建整页——顺带断言倒计时/输入内容在错误展示时不受影响"
    recovery: "重新发码"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-SMS-003
    dimension: 中断
    name: 冷却倒计时不落盘：杀进程重进冷却丢失，可立即再发码
    expected_type: suspected-defect
    method_design:
      state_transition:
        - {from: "冷却中(剩 45s)", event: "杀进程重启", to: "无冷却(可立即发码)", guard: "倒计时仅内存 ValueNotifier"}
    precondition: "短信模式，已发码一次，倒计时进行中"
    steps:
      - do: "发码后等约 15s（剩 ~45s），杀进程后冷启动到登录页"
        expect: "倒计时丢失，重新输入同号可直接发码——设计上必然（卡片已知坑 4），但构成服务端「获取短信频繁」的触发路径，故标 suspected-defect 供报告从评估风险"
      - do: "立即再次发码"
        expect: "观察服务端是否返回频繁限制及文案是否本地化收敛"
    locators:
      hivi_test_ids: ["login_phone_field", "login_submit_button", "login_resend_code_button(对应 ValueKey)"]
      value_keys: ["login-phone-field", "login-submit-button", "login-resend-code-button"]
    test_data: "TEST-SYNTHETIC: tel=13800000001"
    repro_points: "对照组：不发杀进程，返回手机号步再进验证码页，剩余时间应复用（NEG-SMS-004）；本条断言的是跨进程生命周期冷却丢失"
    recovery: "等待服务端频繁窗口过期"
    tags: [L2, negative, flaky?]
    channels: [assertion]

  - case_id: NEG-SMS-004
    dimension: 回退
    name: 同号返回复用剩余冷却 vs 改号立即清零
    expected_type: expected
    method_design:
      decision_table:
        - {conditions: ["同号返回验证码页"], actions: ["复用剩余倒计时，不发码"]}

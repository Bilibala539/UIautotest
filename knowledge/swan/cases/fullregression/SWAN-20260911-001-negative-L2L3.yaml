global_discipline:
  anr_playbook: "ANR 预案（全文件统一，任何交互用例适用）：出现 isn't responding 对话框 → 等待x1（不超过10s）→ 无恢复即 adb shell am force-stop com.swan.network → 冷重启 → 归档 dropbox ANR trace 后继续；不允许反复点等待"
  input_discipline: "输入法/文本输入 ANR 触发点纪律（P-003 嫌疑链路，对齐 SWAN-BUG-20260910-002）：文本输入期间一律不挂录屏；逐字符注入间隔 >=0.5s；优先 adb/Maestro 整串文本注入而非逐键 tap"
  forbidden_zones: "禁区（任何用例步骤不得触达）：个人信息页末位两按钮（person_info_logout_button 退出登入 / person_info_cancel_account_button 注销账号）、平台授权管理页取消授权（-钮）、检查更新入口（app_update_coordinator）、切服（server_environment_manager 入口）。真推送不可依赖（推送 Port 为 no-op 空实现）"
  token_hard_precondition: "token/会话类用例硬前置：先真实登录建立有效会话并验证 token 三处落盘非空（SharedPreferences auth_token / NetworkConfigFallbackStore._httpToken / Dio Authorization header），方可注入/篡改；前置不满足一律标 BLOCKED(credential-required)，禁止降级为空 token 态执行（空态只证明 loginRequired 兜底，不证明失效链路）"
  concurrency_decision: "并发冲突判定沿用 SWAN-20260904-003-DEC-001（NEG-CONCURRENCY-001）固化的 latest-wins：并发同资源操作以最后一次为准，先前在途结果被丢弃且不产生额外副作用"
  blocked_env: "模拟器能力边界（非缺陷，标 BLOCKED(env)）：蓝牙/真实音频客观指标、扫一扫相机预览（虚拟相机无视频流）、真推送到达链路"
  synthetic_data: "所有测试数据 data_label=TEST-SYNTHETIC；短信验证码属人工中断点（凭据 acct-swan-mobile），执行中经主对话向用户收集（优先短信回读）"

  out_of_scope: ["扫码登录(pad)确认页 /login/scan/pad-login-confirm", "平台授权(QQ/网易/酷狗/Qobuz)绑定", "一切破坏性输入场景（逆向通道职责）"]
  locator_dual_track: "全部 UI 用例同时给出 HiviTestIds(Semantics) 与 ValueKey（存在的键），黑盒与 widget test 双轨可用"

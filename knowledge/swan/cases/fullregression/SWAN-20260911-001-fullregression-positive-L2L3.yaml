    evidence: ["login__third_party_weibo__tapped_recheck.png", "logcat-app-death-timestamp.txt", "logcat-weibo-stack.txt（若复现）"]
    steps:
      - do: "启动后台 logcat 抓取（filter FATAL EXCEPTION/UnsatisfiedLinkError/SwanThirdPartyLogin）"
        expect: "logcat 会话就绪"
      - do: "点击微博图标（协议已勾选）"
        expect: "【修复通过判据】无进程死亡：App 保持前台，出现行内提示（复用 login_error_text 槽位）或拉起授权流。【复现判据】FATAL UnsatisfiedLinkError: dlopen failed: library 'libwind.so' not found，进程退桌面——将结论连同 logcat 落 BUG 库（F-1 复现确认）"
      - do: "若 App 存活：冷启动确认可恢复登录页"
        expect: "无残留损坏状态"
    device: android-emulator


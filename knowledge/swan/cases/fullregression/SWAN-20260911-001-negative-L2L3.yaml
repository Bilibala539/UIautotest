cases:
  # ============ 域1 启动与隐私 ============
  - case_id: FR-NEG-START-001
    epic: 启动与隐私
    dimension: 中断
    name: 启动 ANR 探针（P-003 反哺）：冷启动层级可达性门禁
    expected_type: expected
    method_design:
      error_guessing: "冷启动后 10s 内 UI 层级可达性检查；ANR 症状即触发预案"
    precondition: "快照 APK 已安装（adb install -r 升级安装保留 userdata）；设备空闲"
    steps:
      - do: "force-stop 后冷启动 com.swan.network，10s 内 dump UI hierarchy"
        expect: "层级可达（隐私弹窗/登录页/AppShell 任一），无 isn't responding 对话框"
      - do: "若 ANR 对话框出现：等待x1（不超过10s）→ 无恢复即 force-stop → 冷重启，归档 dropbox trace"
        expect: "冷重启后层级可达；ANR 复现记 suspected-defect（对齐 BUG-20260904-004/BUG-20260910-002 嫌疑链）"
    locators: {hivi_test_ids: ["privacy_dialog", "login_page"], value_keys: []}
    test_data: "TEST-SYNTHETIC: 无业务数据"
    repro_points: "本条是全文件所有业务用例的执行前置门禁（P-003 执行从纪律）；ANR 复现先挂起后续交互用例并通知主对话"
    recovery: "force-stop 冷重启"
    tags: [L2, negative, gate]
    channels: [assertion]

  - case_id: FR-NEG-START-002
    epic: 启动与隐私
    dimension: 状态跳跃
    name: 隐私弹窗 PopScope 禁返回 + 拒绝即 exitApp 边界
    expected_type: expected
    method_design:
      state_transition: [{from: privacyRequired, event: back_press, to: privacyRequired(原地), guard: "PopScope canPop:false"}, {from: privacyRequired, event: tap_disagree, to: exitApp}]
    precondition: "清除应用数据后首启（隐私态）；注意本条会真实退出进程，放每轮可执行用例组首位"
    steps:
      - do: "隐私弹窗上按系统返回键"
        expect: "弹窗不关闭、不退出、不进登录页（canPop:false 生效），无崩溃"
      - do: "点不同意按钮"
        expect: "AppSystemPort.exitApp() 触发，进程退出桌面（设计行为）；冷重启后弹窗重现"
    locators: {hivi_test_ids: ["privacy_dialog", "privacy_disagree_button"], value_keys: []}
    test_data: "TEST-SYNTHETIC: 清除 app data 后执行"
    repro_points: "重启后为 privacyRequired 态——后续用例若依赖已同意态需重新点同意；确认不同意不产生半写状态（is_first_launch 取反语义，卡片已知坑9）"
    recovery: "冷重启 → 点同意"
    tags: [L3, negative]
    channels: [assertion]

  - case_id: FR-NEG-START-003
    epic: 启动与隐私
    dimension: 状态跳跃
    name: auth_token 篡改冷启动：直进 authenticated 后首请求暴露失效（卡片已知坑3）
    expected_type: expected
    method_design:
      error_guessing: "token 恢复不校验有效性的破坏验证：注入垃圾 token 冷启动"
    precondition: "硬前置：真实登录建立有效会话且验证 token 三处落盘非空（先登录成功）；adb 可写 SharedPreferences（run-as 不可用 debug 包可直接 adb shell）。前置不满足 → BLOCKED(credential-required)"
    steps:
      - do: "登录成功后将 auth_token 值篡改为 Bearer invalid-token-frneg003"
        expect: "写入成功（明文可改即坐实卡片已知坑3 的存储事实）"
      - do: "force-stop 冷启动"
        expect: "直进 authenticated（AppShell 可达），首屏不发校验请求"
      - do: "触发任一业务请求（如进入搜索发一次查询）"
        expect: "服务端回失效业务码（30003/30001/40006 之一）→ 全局登出清栈落登录页，Toast 登录状态过时；全程无白屏/崩溃"
    locators: {hivi_test_ids: ["login_page", "me_page"], value_keys: []}
    test_data: "TEST-SYNTHETIC: {auth_token: Bearer invalid-token-frneg003}"
    repro_points: "启动直进 authenticated 的瞬间断言不发网络校验（logcat 过滤 HTTP）；失效码回包落登录页耗一次有效会话，排在此域用例组末位"
    recovery: "重新登录"
    tags: [L3, negative]
    channels: [assertion]

  # ============ 域2 会话与登录 ============
  - case_id: FR-NEG-LOGIN-001
    epic: 会话与登录
    dimension: 重复提交
    name: 错误验证码 4 位自动提交 + 同码防重（_lastFailedSmsCode 设计行为边界）
    expected_type: expected
    method_design:
      error_guessing: "4 位即自动提交；同错误码重试被防重钩子跳过——自动化视角的『无反应』边界"
    precondition: "登录页验证码步已到达（手机号步成功发码）；验证码可从主对话获取（人工中断点）或注入失败响应"
    steps:
      - do: "输入 4 位错误验证码（逐字符 >=0.5s 间隔，不挂录屏）"
        expect: "满 4 位即自动提交，行内 login_error_text 出现失败文案，不崩溃"
      - do: "原样重输同一错误码（先清空再输入）"
        expect: "首次重试提交后若再次失败，_lastFailedSmsCode 生效：同一码第三次重复提交被跳过（页面无新请求），属设计行为非卡死——用 logcat 确认无重复 /user/login 请求"
      - do: "修改其中一位再提交"
        expect: "恢复提交（防重仅对同一失败码）"
    locators: {hivi_test_ids: ["login_code_field", "login_error_text"], value_keys: ["login-code-field"]}
    test_data: "TEST-SYNTHETIC: 错误码 0000 / 0001（任意非真值4位）"
    repro_points: "输入纪律：不挂录屏、逐字符 >=0.5s；自动提交与防重并发由 _smsLoginInFlight 兜底，观察 busy 态期间输入不被吞出双请求"
    recovery: "返回手机号步重进"
    tags: [L3, negative]
    channels: [assertion]

  - case_id: FR-NEG-LOGIN-002
    epic: 会话与登录
    dimension: 状态跳跃
    name: 验证码过期/失效响应注入：行内错误收敛不崩溃
    expected_type: expected
    method_design:
      equivalence_classes:
        - {class: 服务端验证码过期业务码, input: "代理注入过期码响应", expected: "行内错误文案，停留验证码步"}
        - {class: 非法响应体（非 Map）, input: "代理注入非 JSON/空体", expected: "_post 包装 success:false + sanitized message，不透出英文异常原文"}
    precondition: "验证码步已到达；代理工具可拦截 /user/login 响应"
    steps:
      - do: "代理将 /user/login 响应改写为验证码过期/错误业务码"
        expect: "login_error_text 出现本地化文案；输入变化即清旧错误（clearLoginError 语义）"
      - do: "代理返回 500/非 Map 响应体"
        expect: "sanitizeApiFailureMessage 收敛为 networkNotConnected 类文案，无堆栈/英文原文透出，页面可继续操作"
    locators: {hivi_test_ids: ["login_code_field", "login_error_text"], value_keys: []}
    test_data: "TEST-SYNTHETIC: 代理注入 {code: 验证码失效业务码} / 非 JSON body"
    repro_points: "断言错误文案与输入框联动清除；DioException 响应体为 Map 时业务码语义保留（卡片错误处理路径契约）"
    recovery: "关闭代理重新发码"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: FR-NEG-LOGIN-003
    epic: 会话与登录
    dimension: 边界值
    name: 60s 倒计时内存态三边界：杀进程冷却丢失/同号复用/改号清零（卡片已知坑4）
    expected_type: expected
    method_design:
      boundary_values:
        - {field: 冷却剩余时间, value: "杀进程重进", expected: "冷却丢失，可立即再发码（服务端获取短信频繁限制兜底）"}
        - {field: 冷却剩余时间, value: "同号返回手机号步再进验证码步", expected: "复用剩余时间，不重发"}
        - {field: 冷却剩余时间, value: "改手机号", expected: "清零重发"}
    precondition: "需真实短信验证码（人工中断点 acct-swan-mobile）；未收集到即 BLOCKED(credential-required)"
    steps:
      - do: "发码进入验证码步，等待约 30s 后杀进程冷重启，同号重进验证码步"
        expect: "倒计时从头开始（内存态不落盘），可立即点重发；若服务端回『获取短信频繁』类文案，行内收敛展示"
      - do: "返回手机号步（保留号码）再进验证码步"
        expect: "倒计时复用剩余时间，无新发码请求（logcat 无第二次 /user/captcha）"
      - do: "改手机号再进"
        expect: "倒计时清零并正常发码"
    locators: {hivi_test_ids: ["login_phone_field", "login_code_field"], value_keys: ["login-resend-code-button"]}
    test_data: "TEST-SYNTHETIC: 双测试手机号（TEST-SYNTHETIC 标记）"
    repro_points: "验证码消耗短信资源，一轮内合并三步连续执行；服务端频繁限制文案属预期兜底非缺陷"
    recovery: "等待冷却结束"
    tags: [L3, negative, flaky]
    channels: [assertion]

  - case_id: FR-NEG-LOGIN-004
    epic: 会话与登录
    dimension: 非法格式
    name: F-2 回归：密码 6 位假值点亮登录键 + 点击 ANR（SWAN-BUG-20260910-002）
    expected_type: suspected-defect
    method_design:
      error_guessing: "已知缺陷回归：前端无长度校验，6 位假密码提交触发主线程 ANR 循环"
    precondition: "登录页密码模式（login_use_password_button 切换）；ANR 预案待命；文本输入期间不挂录屏"
    steps:
      - do: "逐字符输入 6 位 123456（间隔 >=0.5s）"
        expect: "记录登录键是否点亮（BUG-002 现象：无长度校验即点亮）"
      - do: "点击登录键"
        expect: "若快照已修复：行内错误文案（密码校验/服务端错误），无 ANR；若未修复：5s 内 ANR 对话框 → 触发 ANR 预案（等待x1→force-stop→冷重启）并记 suspected-defect（F-2 未修复）"
      - do: "ANR 后核对服务端到达（可选，留报告从定级）：测试服查 13800138000/123456 登录到达记录"
        expect: "到达与否仅作证据补充，不影响本条判定"
    locators: {hivi_test_ids: ["login_password_field", "login_submit_button", "login_error_text"], value_keys: ["login-password-field"]}
    test_data: "TEST-SYNTHETIC: {password: 123456, tel: 13800138000}"
    repro_points: "与 BUG-002 证据链对齐（states-matrix §11-12）；ANR 复现时归档 dropbox trace 与录屏（ANR 确认后再录，输入期间禁录）；对照组见 FR-NEG-LOGIN-006（验证码模式非法号段有行内校验）"
    recovery: "ANR 预案：等待x1 → force-stop → 冷重启"

      value_keys: ["login-agreement-checkbox", "login-submit-button"]
    test_data: "TEST-SYNTHETIC: tel=13800000001"
    repro_points: "「可见由平台决定、可点由协议决定」——OHOS 平台第三方隐藏时勾选协议也不出现图标（平台差异断言，待 OHOS 设备在环）"
    recovery: "勾选协议"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-PERM-002
    dimension: 权限缺失

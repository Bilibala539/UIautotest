      state_transition:
        - {from: "privacyRequired", event: "系统返回键/返回手势", to: "privacyRequired(不变)", guard: "canPop:false"}
    precondition: "首装态，隐私弹窗可见"
    steps:
      - do: "弹窗可见时按系统返回键/侧滑返回手势"
        expect: "弹窗不消失、不落入登录页、App 不退出到桌面后跳过隐私（记录平台实际表现：留在弹窗 or exitApp）"
      - do: "弹窗可见时尝试深链 /login"
        expect: "启动状态机拦在 privacyRequired，深链无法绕过弹窗直达登录页（命名路由只是别名，home 由 stage 决定）"
    locators:
      hivi_test_ids: ["privacy_dialog", "login_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: 深链 adb shell am start -d scheme:///login"
    repro_points: "深链绕过是本条核心破坏点：AppStartupGate.home 覆盖命名路由——若深链能进登录页并提交登录，记 suspected-defect（隐私未同意即建立会话）"
    recovery: "正常同意或不同意"
    tags: [L2, negative]
    channels: [assertion]

  # ============ 登出路径 ============
  - case_id: NEG-OUT-001
    dimension: 断网
    name: 服务端登出失败：token 保留、停留原页、仅 Toast
    expected_type: expected
    method_design:
      decision_table:
        - {conditions: ["断网点退出登入"], actions: ["/user/logout 失败，仅 Toast，不清本地 token，停留 person_info"]}
        - {conditions: ["服务端 5xx 点退出登入"], actions: ["同上"]}
    precondition: "已登录进个人信息页；可断网或代理 5xx"
    steps:
      - do: "断网后点 person_info_logout_button"
        expect: "失败仅 Toast（无二次确认弹窗——设计如此）；不跳登录页；auth_token 仍在（三处存储均未清）"
      - do: "恢复网络后刷新页面"
        expect: "用户仍为登录态（token 有效），数据正常"
    locators:
      hivi_test_ids: ["person_info_page", "person_info_logout_button", "me_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: 已登录会话"
    repro_points: "反面确认：登出失败后手动杀进程重进，token 仍恢复进 authenticated——「失败不清本地」的持久化后果；无二次确认直接登出成功路径的用户误触风险记 UX 注记非本条断言"
    recovery: "恢复网络重试登出"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-OUT-002
    dimension: 服务降级
    name: 切服登出不请求旧服 logout：服务端会话残留
    expected_type: expected
    method_design:
      error_guessing: "切服路径的清理范围核查"
    precondition: "已登录（服 A）；「关于我们」页可达服 B 切换入口"
    steps:
      - do: "在「关于我们」切到服 B"
        expect: "客户端直接清本地 token 回登录页，全程零 /user/logout 请求（代理断言，对齐 iOS 设计行为）"
      - do: "用抓包/服务端视角核对服 A"
        expect: "服 A 会话未注销（残留）——设计行为但记安全注记：共享设备场景旧会话在服务端仍有效，报告从可评估"
      - do: "在服 B 登录页重新登录"
        expect: "登录页无需重建即命中新 base（_baseUrl 动态读 fallback），登录成功进服 B 会话"
    locators:
      hivi_test_ids: ["login_page", "me_page"]
      value_keys: []
    test_data: "TEST-SYNTHETIC: Debug 服 http://8.129.106.82/api ↔ 显式 HIVI_API_BASE_URL 覆盖地址（禁止使用生产 base）"
    repro_points: "切服一次性写 API/AI HTTP/AI WebSocket 三地址——断言三地址都切换（WebSocket 残留旧地址是潜在破坏点）；切服后 Qobuz 星标缓存等 _clearSessionState 清理是否同样执行需核对（切服走的是清 token 还是完整 _clearSessionState，卡片未逐行确认，记录观察）"
    recovery: "切回原服"
    tags: [L2, negative, security-recon]
    channels: [assertion]

  # ============ 50015 绑定页 ============
  - case_id: NEG-BIND-001
    dimension: 超长
    name: 绑定页异常输入：超长手机号/空验证码/非法区号
    expected_type: expected
    method_design:
      equivalence_classes:
        - {class: "超长手机号(>11 位)", input: "1380000000100000", expected: "输入限制或提交后服务端拒绝，文案收敛"}
        - {class: "空验证码", input: "code=''", expected: "记录客户端拦截 or 服务端拒绝"}
        - {class: "非法区号", input: "area='++++'/'abc'", expected: "area 去 + 后上送形态核对"}
    precondition: "第三方登录返回 50015 进入 /login/bind-phone（Mock 第三方 credential + 服务端 50015 响应）"
    steps:
      - do: "绑定页依次输入各异常等价类并提交"
        expect: "无崩溃；请求体形态符合契约：短信 body + thirdPartyId/thirdPartyName，loginType fallback '2'，固定冗余 code/password 字段（代理断言）"
      - do: "非法区号（含多个 +）提交"
        expect: "area 去 '+' 处理后上送，观察服务端响应与文案收敛"
    locators:
      hivi_test_ids: ["login_phone_field", "login_code_field", "login_error_text"]
      value_keys: ["login-phone-field", "login-code-field"]
    test_data: "TEST-SYNTHETIC: thirdPartyId='mock-third-party-001', tel=13800000001"
    repro_points: "绑定成功复用同一 token 收口——若绑定接口返回新 token 而客户端仍用旧 token，属状态跳跃破坏点（代理对比前后 token 值）"
    recovery: "修正输入"
    tags: [L2, negative]
    channels: [assertion]

  - case_id: NEG-BIND-002
    dimension: 状态跳跃
    name: 绑定页深链直入无参数：BindPhoneRouteArgs 缺失时 fallback 行为
    expected_type: suspected-defect
    method_design:
      state_transition:
        - {from: "任意 stage", event: "深链 /login/bind-phone 无 args", to: "观察 fallback", guard: "命名路由别名可达"}
    precondition: "App 可响应深链（adb am start -d）"
    steps:
      - do: "未登录/未触发 50015 的情况下深链直达 /login/bind-phone"
        expect: "启动状态机应拦在 loginRequired/privacyRequired；若可达绑定页，记录 args 缺失时的 fallback（thirdPartyId 为空、loginType:'2'）实际表现"
      - do: "若绑定页可达，直接提交空 thirdPartyId"
        expect: "观察服务端响应与客户端文案；无崩溃即记录，任何异常状态记 suspected-defect 信号"
    locators:
      hivi_test_ids: ["login_page"]
      value_keys: ["login-phone-field", "login-code-field"]
    test_data: "TEST-SYNTHETIC: 深链 scheme:///login/bind-phone"
    repro_points: "卡片未决问题：绑定页参数 fallback loginType:'2' 的实际触发路径未逐行确认——本条目的就是把「深链无参」这条路径实际跑出来定性；登录请求体冗余字段（password:''/code:''）在绑定请求中的形态一并代理核对"
    recovery: "返回登录页"
    tags: [L2, negative, experimental?]
    channels: [assertion]

  - case_id: NEG-BIND-003
    dimension: 状态跳跃
    name: 绑定页内会话失效/返回中断：清栈与 token 收口的交叉
    expected_type: expected
    method_design:
      error_guessing: "绑定请求在途时注入失效码 / 用户中途返回"
    precondition: "已进入绑定页（50015 路径）"
    steps:
      - do: "绑定提交在途时代理注入 30003"
        expect: "全局失效链优先：清栈回登录页，绑定流程中止，无半绑定状态"
      - do: "绑定页点返回（未提交）"
        expect: "返回登录页，第三方 credential 丢弃，再次第三方登录重新走 50015 流程，无状态残留"
    locators:
      hivi_test_ids: ["login_page"]
      value_keys: ["login-phone-field", "login-code-field"]
    test_data: "TEST-SYNTHETIC: thirdPartyId='mock-third-party-002'"
    repro_points: "绑定成功复用同一 token——若失效码在绑定响应后瞬间到达，验证 token 收口与登出清理的时序竞争（adoptToken 与 logout 顺序）无脏状态"
    recovery: "重新登录"
    tags: [L2, negative, flaky?]
    channels: [assertion]

  # ============ 权限缺失 ============
  - case_id: NEG-PERM-001
    dimension: 权限缺失
    name: 协议未勾选：主按钮与第三方图标的可点性边界
    expected_type: expected
    method_design:
      decision_table:
        - {conditions: ["协议未勾选", "点短信主按钮"], actions: ["不提交，协议区域提示/抖动（记录实际表现），零请求"]}
        - {conditions: ["协议未勾选", "点第三方图标"], actions: ["不拉起 SDK（可点仅由协议决定），零授权"]}
        - {conditions: ["协议勾选", "第三方授权中"], actions: ["图标不置灰（防微信中途返回卡死）"]}
    precondition: "登录页首进，协议默认未勾选"
    steps:
      - do: "未勾选协议，分别点短信主按钮/密码主按钮/第三方图标"
        expect: "代理断言零 /user/captcha、/user/login、SDK 拉起；记录未勾选时的 UI 反馈形态"

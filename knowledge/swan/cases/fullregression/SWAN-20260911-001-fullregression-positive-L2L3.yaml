# ------------------------------------------------------------
# 全局禁区（严禁写入任何步骤，执行层同样受约）
# ------------------------------------------------------------
forbidden_zones:
  - "person_info_page 末位两按钮：注销账号(person_info_cancel_account_button)/退出登入(person_info_logout_button)——仅语义树核对文案，零点击"
  - "平台页已授权行 − 钮（取消授权）——零点击"
  - "关于页/帮助页「软件升级·检查更新」——零点击（仅定位）"
  - "切服/服务端环境切换（本基线无 UI 入口，若出现入口同样禁点）"
  - "电台行体与 → 钮（P-9-1 实证：任何点击=自动播放）——禁点击类操作"
  - "推送类断言严禁依赖真推送（推送 Port 为 no-op 空实现，到达链路不存在）"
  - "共享设备存储禁通配删除（T-4 教训）"

# ------------------------------------------------------------
# 环境限制（涉音响实体/蓝牙/相机的用例标注 device-divergence 或 BLOCKED(env)）
# ------------------------------------------------------------
env_constraints:
  - "模拟器无蓝牙/真实音频硬件：实配网、蓝牙发现、音频客观指标 = BLOCKED(env)"
  - "虚拟相机无视频流：扫一扫止步于『相机不可用』错误态（非缺陷），真机预期出预览 = device-divergence"
  - "adb input text 中文 NPE（CJK 输入限制）：搜索/输入类用例一律用 ASCII 关键词"
  - "电台流在无实体扬声器下必失败并自动切台：任何播放触发都会污染状态——播放域用例只断言结构与状态，不触发播放"
  - "账号绑定管理页未裁决（疑含解绑写操作）：只定位不进入"

automation_guidance:   # 全局规范（02-L2功能.yaml v1.1，逐 case 只写差异项）
  selector_priority: "稳定文本 text > resource-id > 关系选择器(below/childOf) > 状态条件(enabled) > index 兜底；禁用坐标"
  waiting: "轮询断言代替 sleep：assertVisible/assertNotVisible 自带等待；登录发码跳转实测 3~60s（states-matrix O-7），必须 extendedWaitUntil 设真实超时，禁止 sleep"
  animation: "底部弹层（音质设置/Spotify 引导）与 Tab 切换前 waitForAnimationToEnd"
  ghost_tap: "tapOn 加 retryTapIfNoChange: true"
  evidence_convention: "截图命名 <页面>__<功能区>__<状态>.png 三段式（对齐 states-matrix 颗粒度）；证据根 F:\\SwanApp-Toolchain\\results\\SWAN-20260911-001-fullregression\\evidence\\"

# 前置分类约定 precondition_class:
#   免登录            = 无需任何账号，清数据冷启动即可执行
#   需登录态          = 依赖 userdata 保留的既有登录态（升级安装后直接可用）
#   credential-required = 需真实凭据/短信码（任务卡人工中断点：经主对话向用户收集）

shared_precondition: "emulator-5554 已装 snapshot-20260911（adb install -r 保留 userdata）；swan-qa 设备池占用规则生效"

